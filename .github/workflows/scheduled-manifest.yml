name: Scheduled project manifest
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'peteywee/topshelf-operating-system'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFIER: f6b598d65497a94ead3ec9ca4225a23ecac22bde
    steps:
      - name: Check out trusted worker
        uses: actions/checkout@v4
        with:
          path: worker
          ref: ${{ env.VERIFIER }}
          persist-credentials: false
      - name: Check out event snapshot as data
        uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned receipt reader
        uses: actions/checkout@v4
        with:
          ref: 7d76e907eeaec5212185f02ce740a8cc84148d41
          path: reader
          sparse-checkout: |
            scripts/receipt-integrity.py
            schemas/scheduled-manifest-receipt.v1.schema.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare JSON Schema validator
        run: |
          if ! /usr/bin/python3 -c 'from jsonschema import Draft202012Validator'; then
            sudo apt-get update -qq && sudo apt-get install -y python3-jsonschema
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: worker/.nvmrc
      - name: Build trusted worker
        id: build
        working-directory: worker
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Prepare evidence directory
        run: mkdir evidence
      - name: Run the granted kernel-source manifest
        id: manifest
        run: |
          set -eu
          umask 077
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          root="$(node -p "require('node:os').userInfo().homedir")/.tos-execution"
          install -d -m 700 "$root" "$root/grants"
          job="kernel-$GITHUB_SHA"
          jq -n --arg job "$job" --arg commit "$GITHUB_SHA" \
            '{jobId:$job, capability:"project-file-manifest",commit:$commit,scope:"packages/kernel"}' > evidence/order.json
          jq -n --slurpfile order evidence/order.json --arg repo "$(realpath source)" \
            '{order:$order[0],repository:$repo}' > "$root/grants/$job.json"
          node worker/packages/cli/dist/index.js execute manifest evidence/order.json > evidence/execution.json
          cp "$root/jobs/$job/manifest.json" evidence/manifest.json
          test "$(sha256sum evidence/manifest.json | cut -d' ' -f1)" = "$(jq -er 'select(.status=="succeeded").sha256' evidence/execution.json)"
      - name: Verify approved inventory independently
        id: inventory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -eu
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y bubblewrap
          fi
          target="$(realpath source)"
          node worker/scripts/inventory-renew.mjs grant "$target" 1f7431860c6614ae73b7c3302debe31db8f39c6d TOS-EVD-012
          worker/scripts/inventory-renew-worker.sh run "$target" > evidence/inventory.json
          jq -e --arg sha "$GITHUB_SHA" '.status == "verified" and .commit == $sha' evidence/inventory.json >/dev/null
      - name: Read back requirement readiness
        id: readiness
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' }}
        run: |
          (cd source && node ../worker/packages/cli/dist/index.js requirement ready TOS-REQ-002) > evidence/readiness.json
          jq -e '.status == "ready" and .requirementId == "TOS-REQ-002"' evidence/readiness.json >/dev/null
      - name: Write v1 receipt
        if: ${{ !cancelled() }}
        id: receipt
        env:
          RESULT: ${{ job.status }}
          MANIFEST: ${{ steps.manifest.outcome }}
          INVENTORY: ${{ steps.inventory.outcome }}
          READINESS: ${{ steps.readiness.outcome }}
        run: |
          digest=null
          if [[ "$MANIFEST" == success ]]; then
            digest=$(jq -ce '.sha256 | select(test("^[a-f0-9]{64}$"))' evidence/execution.json)
          fi
          jq -cn --arg commit "$GITHUB_SHA" --arg verifier "$VERIFIER" --arg run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg result "$RESULT" --arg manifest "$MANIFEST" \
            --arg inventory "$INVENTORY" --arg readiness "$READINESS" --argjson digest "$digest" \
            '{v:1,commit:$commit,verifier:$verifier,scope:"packages/kernel",run:$run,attempt:$attempt,
              result:$result,manifest:$manifest,inventory:$inventory,readiness:$readiness,sha256:$digest}' > receipt.json
          key=$(jq -c 'del(.run,.attempt)' receipt.json | sha256sum | cut -d' ' -f1)
          if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then key="$key-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; fi
          echo "name=receipt-v1-$key" >> "$GITHUB_OUTPUT"
      - name: Check for a retained equivalent success
        if: ${{ success() && github.run_attempt == '1' }}
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.receipt.outputs.name }}
        run: |
          decision=$(/usr/bin/python3 reader/scripts/receipt-integrity.py reuse)
          if [[ "$decision" == reuse ]]; then echo 'duplicate=true' >> "$GITHUB_OUTPUT"; fi
      - name: Publish compact receipt
        id: upload
        if: ${{ !cancelled() && steps.receipt.outcome == 'success' && steps.previous.outputs.duplicate != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.receipt.outputs.name }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Confirm published receipt or fail delivery
        if: ${{ !cancelled() && steps.previous.outputs.duplicate != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.receipt.outputs.name }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: /usr/bin/python3 reader/scripts/receipt-integrity.py confirm
