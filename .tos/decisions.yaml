schema_version: 1
decisions:
  - id: TOS-DEC-001
    title: Official product name
    status: approved
    authority: Patrick Craven
    decided_on: "2026-07-23"
    decision: The official and exclusive product name is TopShelf Operating System, abbreviated TOS.
    supersedes:
      - TopShelf Op Sys
    evidence:
      - README.md
      - docs/01-charter-and-governing-principles.md
  - id: TOS-DEC-002
    title: Separate product repository
    status: superseded
    authority: Patrick Craven
    decided_on: "2026-07-24"
    decision: TOS is implemented in peteywee/topshelf-operating-system; topshelf-project-template remains a predecessor until parity is proven and then is archived rather than deleted.
    evidence:
      - docs/11-implementation-and-migration-plan.md
  - id: TOS-DEC-003
    title: Batch implementation model
    status: approved
    authority: Patrick Craven
    decided_on: "2026-07-24"
    decision: TOS implementation proceeds through bounded batches with acceptance criteria, validation, evidence, and pull-request review.
    evidence:
      - docs/implementation/tos-0.1-batch-1.md
  - id: TOS-DEC-004
    title: TOS canonical repository and predecessor retirement
    status: approved
    authority: Patrick Craven
    decided_on: "2026-09-01"
    decision: TopShelf Operating System is canonical in peteywee/topshelf-operating-system. The former topshelf-project-template is retired and deleted as a separate architectural authority; reusable predecessor logic may be integrated into TOS through controlled change.
    supersedes:
      - TOS-DEC-002
    evidence:
      - README.md
      - https://github.com/peteywee/topshelf-operating-system/issues/17
  - id: TOS-DEC-005
    title: Technology-agnostic governance kernel
    status: approved
    authority: Patrick Craven
    decided_on: "2026-09-01"
    decision: TOS governance and control-plane contracts must be technology-agnostic. TypeScript, Node.js, and pnpm may remain implementation choices for the TOS repository but must not constrain governed projects to that ecosystem.
    evidence:
      - README.md
      - https://github.com/peteywee/topshelf-operating-system/issues/17
  - id: TOS-DEC-006
    title: JSON-first machine-readable interfaces and state direction
    status: approved
    authority: Patrick Craven
    decided_on: "2026-09-01"
    decision: JSON must become central to TOS machine-readable interfaces and state, with explicit schemas and structured agent input/output. Existing YAML-heavy .tos state remains current implementation until migrated through controlled compatibility-preserving changes; this decision does not authorize a blind mass rewrite.
    evidence:
      - README.md
      - schemas/
      - https://github.com/peteywee/topshelf-operating-system/issues/17
  - id: TOS-DEC-007
    title: Primary real-world proving workloads and workflows
    status: approved
    authority: Patrick Craven
    decided_on: "2026-09-01"
    decision: TOS will be grounded against three primary proving workloads/workflows: Teach for SaaS and production governance, xqueue for operational automation and external side effects, and bounded autonomous execution centered on tos execute next for the TOS execution model itself.
    evidence:
      - README.md
      - https://github.com/peteywee/topshelf-operating-system/issues/17
  - id: TOS-DEC-008
    title: GitHub as durable project-management record
    status: approved
    authority: Patrick Craven
    decided_on: "2026-09-01"
    decision: GitHub milestones and issues are durable TOS project-management records. Material bounded work should have a GitHub issue before implementation unless an explicit exception applies, and milestone/issue status must be updated with evidence and closeout rather than relying on conversation history.
    evidence:
      - https://github.com/peteywee/topshelf-operating-system/issues/16
      - https://github.com/peteywee/topshelf-operating-system/issues/17
