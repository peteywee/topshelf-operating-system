schema_version: 1
modules:
  - id: foundation-contracts
    status: active
    source: contracts/
    reason: Defines the named and templated foundation contract surface.
  - id: canonical-state
    status: active
    source: .tos/
    reason: Establishes machine-readable authoritative project state.
  - id: kernel
    status: active
    source: packages/kernel/
    reason: Loads, discovers, and validates canonical TOS state.
  - id: cli
    status: active
    source: packages/cli/
    reason: Exposes the executable TOS command surface.
  - id: agent-governance
    status: active
    source: agents/ and skills/
    reason: Defines governed human-assisted roles, authority boundaries, and reusable skills.
  - id: contract-registry
    status: active
    source: packages/contracts/src/index.ts
    reason: Provides the validated 105-template catalog and registry reconciliation.
  - id: contract-change-control
    status: active
    source: packages/contracts/src/change.ts
    reason: Provides controlled proposals, version classification, validation, redlines, and impact analysis.
  - id: contract-authorization-gate
    status: active
    source: packages/contracts/src/authorization.ts
    reason: Provides independent-audit, owner-approval, evidence, promotion, and direct-edit enforcement.
  - id: truth-engine
    status: active
    source: packages/kernel/src/truth.ts
    reason: Validates canonical fact identity, state, provenance, confidence, freshness, and invalidation rules.
  - id: truth-reconciliation
    status: active
    source: packages/kernel/src/reconcile.ts
    reason: Detects duplicate, contradictory, authority-disputed, and verification-disputed claims without choosing a winner.
  - id: requirements-traceability
    status: active
    source: packages/kernel/src/requirements.ts
    reason: Links facts and contracts to owned requirements, acceptance criteria, and required evidence.
  - id: inspect-boot
    status: active
    source: packages/kernel/src/inspect.ts and packages/kernel/src/boot.ts
    reason: Derives repository signals, unresolved intake, module applicability, and validates the owner-authorized agent boot packet.
  - id: intake-standards
    status: planned
    source: standards/intake/ and packages/kernel/src/intake.ts
    reason: Owns TopShelf terminology, answer validity, project and operation classification, project tiering, artifact tailoring, and module selection.
  - id: scheduler
    status: planned
    source: packages/scheduler/
    reason: Deferred until file-based work orders demonstrate a measured concurrency limitation.
