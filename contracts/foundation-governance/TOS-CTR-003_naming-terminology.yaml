  identifier_patterns: <define identifier patterns>
  file_naming_rules: <define file naming rules>
  deprecated_terms:
    TSAL_application: Use TSAL standard or TSAL interfaces; TSAL is not a TOS application.
    workload_module: Use workload for independent domain systems; module is reserved for TOS capabilities.
    credential_authority: Prohibited equivalence; credentials enable access but do not grant policy authority.
