name: TOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, and test
        run: pnpm check

      - name: Test documentation freshness control
        run: pnpm test:doc-freshness

      - name: Validate governed documentation freshness
        run: node scripts/check-doc-freshness.mjs --registry .tos/document-freshness.json --ref HEAD --json

      - name: Report runtime version
        run: |
          pnpm tos -- --version > /tmp/tos-version.txt
          grep -q "0.2.1" /tmp/tos-version.txt

      - name: Validate canonical state
        run: pnpm tos -- validate

      - name: Report project status
        run: pnpm tos -- status

      - name: Validate canonical facts
        run: |
          pnpm tos -- fact validate 2026-07-25 > /tmp/tos-fact-validation.txt
          grep -q "OK: fact catalog is valid (3 records, 0 stale, as of 2026-07-25)." /tmp/tos-fact-validation.txt
          pnpm tos -- fact list 2026-07-25 > /tmp/tos-fact-list.txt
          grep -q "Fact catalog: 3 records (as of 2026-07-25)" /tmp/tos-fact-list.txt
          grep -q "TOS-FACT-003" /tmp/tos-fact-list.txt
          pnpm tos -- fact show TOS-FACT-001 2026-07-25 > /tmp/tos-fact-001.yaml
          grep -q "status: verified_yes" /tmp/tos-fact-001.yaml

      - name: Validate current canonical liveness
        run: |
          CURRENT_DATE="$(date -u +%F)"
          echo "Current UTC liveness date: ${CURRENT_DATE}"
          pnpm tos -- fact validate "${CURRENT_DATE}" > /tmp/tos-current-facts.txt
          grep -q "0 stale" /tmp/tos-current-facts.txt
          pnpm tos -- requirement validate "${CURRENT_DATE}" > /tmp/tos-current-requirements.txt
          grep -q "OK: requirement catalog is valid" /tmp/tos-current-requirements.txt
          pnpm tos -- boot validate "${CURRENT_DATE}" > /tmp/tos-current-boot.txt
          grep -q "OK: boot packet is valid and ready" /tmp/tos-current-boot.txt

      - name: Reconcile truth and validate requirements
        run: |
          pnpm tos -- fact reconcile 2026-07-25 > /tmp/tos-fact-reconcile.yaml
          grep -q "conflicts: \[\]" /tmp/tos-fact-reconcile.yaml
          pnpm tos -- fact conflicts 2026-07-25 > /tmp/tos-fact-conflicts.txt
          grep -q "OK: no fact conflicts found" /tmp/tos-fact-conflicts.txt
          pnpm tos -- requirement validate 2026-07-25 > /tmp/tos-requirement-validation.txt
          grep -q "OK: requirement catalog is valid (2 records" /tmp/tos-requirement-validation.txt
          pnpm tos -- requirement list 2026-07-25 > /tmp/tos-requirement-list.txt
          grep -q "TOS-REQ-002" /tmp/tos-requirement-list.txt
          pnpm tos -- requirement trace TOS-REQ-001 2026-07-25 > /tmp/tos-requirement-trace.yaml
          grep -q "TOS-FACT-003" /tmp/tos-requirement-trace.yaml
          pnpm tos -- requirement gaps 2026-07-25

      - name: Inspect repository and validate boot
        run: |
          pnpm tos -- inspect 2026-07-30 > /tmp/tos-inspection.yaml
          grep -q "value: pnpm" /tmp/tos-inspection.yaml
          grep -q "id: software-engineering" /tmp/tos-inspection.yaml
          grep -q "decision: required" /tmp/tos-inspection.yaml
          pnpm tos -- intake 2026-07-30 > /tmp/tos-intake.txt
          grep -q "TOS-INTAKE-003" /tmp/tos-intake.txt
          pnpm tos -- boot validate 2026-07-30 > /tmp/tos-boot-validation.txt
          grep -q "OK: boot packet is valid and ready" /tmp/tos-boot-validation.txt
          pnpm tos -- boot show 2026-07-30 > /tmp/tos-boot.yaml
          grep -q "ready: true" /tmp/tos-boot.yaml
          grep -q "planner: human_assisted" /tmp/tos-boot.yaml
          if grep -q "planner: autonomous" /tmp/tos-boot.yaml; then
            echo "Boot packet incorrectly enabled autonomous planning" >&2
            exit 1
          fi

      - name: Validate canonical intake standards
        run: |
          pnpm tos -- intake questions > /tmp/tos-intake-questions.yaml
          grep -q "question_count: 33" /tmp/tos-intake-questions.yaml
          grep -q "id: needs_autonomous_agents" /tmp/tos-intake-questions.yaml
          pnpm tos -- intake explain needs_autonomous_agents > /tmp/tos-intake-explain.yaml
          grep -q "material actions without case-by-case human approval" /tmp/tos-intake-explain.yaml
          pnpm tos -- intake validate examples/intake/controlled-autonomy.answers.json > /tmp/tos-intake-validation.txt
          grep -q "OK: intake answers are valid (33 questions)." /tmp/tos-intake-validation.txt
          grep -q "Tier: controlled" /tmp/tos-intake-validation.txt
          grep -q "Authorization ready: true" /tmp/tos-intake-validation.txt
          pnpm tos -- intake evaluate examples/intake/controlled-autonomy.answers.json > /tmp/tos-intake-evaluation.yaml
          grep -q "work_classification: project" /tmp/tos-intake-evaluation.yaml
          grep -q "project_tier: controlled" /tmp/tos-intake-evaluation.yaml
          grep -q "needs_autonomous_agents=yes" /tmp/tos-intake-evaluation.yaml
          grep -q "approval-authority-matrix" /tmp/tos-intake-evaluation.yaml
          grep -q "agent-workflow" /tmp/tos-intake-evaluation.yaml
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("examples/intake/controlled-autonomy.answers.json","utf8"));p.client_facing="maybe";fs.writeFileSync("/tmp/tos-invalid-intake.json",JSON.stringify(p));'
          if pnpm tos -- intake validate /tmp/tos-invalid-intake.json; then
            echo "Unsupported intake answer incorrectly passed validation" >&2
            exit 1
          fi

      - name: Validate contract catalog
        run: pnpm tos -- contract validate

      - name: Smoke contract inventory
        run: |
          pnpm tos -- contract list > /tmp/tos-contract-list.txt
          grep -q "Contract catalog: 105 templates" /tmp/tos-contract-list.txt
          pnpm tos -- contract show TOS-CTR-085 > /tmp/tos-contract-085.yaml
          grep -q "contract_type: Agent Role" /tmp/tos-contract-085.yaml

      - name: Validate contract change proposal
        run: |
          pnpm tos -- contract change validate examples/contract-changes/TOS-CHG-2026-001.yaml
          pnpm tos -- contract propose TOS-CTR-085 TOS-CHG-2026-002 "Patrick Craven" "Clarify role authority" > /tmp/tos-change-scaffold.yaml
          grep -q "change_id: TOS-CHG-2026-002" /tmp/tos-change-scaffold.yaml

      - name: Smoke semantic redline and impact report
        run: |
          pnpm tos -- contract diff TOS-CTR-085 examples/contract-changes/drafts/TOS-CHG-2026-001_TOS-CTR-085.yaml > /tmp/tos-contract-diff.txt
          grep -q "Semantic diff: TOS-CTR-085" /tmp/tos-contract-diff.txt
          pnpm tos -- contract impact TOS-CTR-085 > /tmp/tos-contract-impact.yaml
          grep -q "contractId: TOS-CTR-085" /tmp/tos-contract-impact.yaml

      - name: Exercise authorization gate
        run: |
          pnpm tos -- contract gate examples/contract-changes/TOS-CHG-2026-900-simulated-approved.yaml "Example Owner" > /tmp/tos-contract-gate.txt
          grep -q "is authorized for contracts/ai-agent/TOS-CTR-085_agent-role.yaml" /tmp/tos-contract-gate.txt
          if pnpm tos -- contract gate examples/contract-changes/TOS-CHG-2026-900-simulated-approved.yaml "Patrick Craven"; then
            echo "Simulation packet incorrectly satisfied the real-owner gate" >&2
            exit 1
          fi

      - name: Enforce direct-edit protection
        run: pnpm contract:guard
