schema_version: 1
modules:
  - id: foundation-contracts
    status: active
    source: contracts/
    reason: Defines the named and templated foundation contract surface.
  - id: canonical-state
    status: active
    source: .tos/
    reason: Establishes machine-readable authoritative project state.
  - id: kernel
    status: active
    source: packages/kernel/
    reason: Loads, discovers, and validates canonical TOS state.
  - id: cli
    status: active
    source: packages/cli/
    reason: Exposes the executable TOS command surface.
  - id: agent-governance
    status: active
    source: agents/ and skills/
    reason: Defines the Contract Steward, Contract Auditor, Evidence Steward, Release & Promotion Steward, Truth Steward, authority boundaries, and human-assisted skills.
  - id: contract-registry
    status: active
    source: packages/contracts/src/index.ts
    reason: Provides the validated 105-template catalog and registry reconciliation.
  - id: contract-change-control
    status: active
    source: packages/contracts/src/change.ts
    reason: Provides controlled proposals, version classification, validation, redlines, and impact analysis.
  - id: contract-authorization-gate
    status: active
    source: packages/contracts/src/authorization.ts
    reason: Provides independent-audit, owner-approval, evidence, promotion, and direct-edit enforcement validated on Node.js 20 and 22.
  - id: truth-engine
    status: active
    source: packages/kernel/src/truth.ts
    reason: TOS 0.2 Batch 3A validates canonical fact identity, state, provenance, confidence, freshness, and invalidation rules.
  - id: scheduler
    status: planned
    source: packages/scheduler/
    reason: Scheduled for TOS 0.3 after truth and intake contracts stabilize.
